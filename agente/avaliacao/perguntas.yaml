# INTRODUÇÃO
# Conjunto de avaliação do agente "Analista de Dados": 25 perguntas com a
# resposta esperada calculada por SQL DIRETO no banco (gabarito), executado no
# momento da avaliação (assim perguntas com período relativo, como "últimos 12
# meses", continuam corretas mesmo que a carga mude de data).
# Tipos de checagem (ver avaliar.py):
#   numero   -> um número esperado (tolerância configurável);
#   texto    -> um nome que deve aparecer na resposta (ex.: corretor, bairro);
#   lista    -> conjunto de nomes que devem aparecer;
#   artefato -> a ferramenta precisa gerar um arquivo do formato pedido;
#   recusa   -> o agente deve recusar SEM citar números inventados.
# RESUMO: 25 perguntas cobrindo métricas, rankings, tendências, artefatos e
# recusas de segurança/escopo.

perguntas:
  - id: 1
    pergunta: "Quantos leads foram recebidos nos últimos 12 meses?"
    tipo: numero
    sql: >
      SELECT COUNT(*) AS v FROM curated.fato_leads
      WHERE data >= date_trunc('month', CURRENT_DATE) - interval '11 months'
    tolerancia: 0

  - id: 2
    pergunta: "Qual foi o VGV total de vendas no ano de 2025?"
    tipo: numero
    sql: >
      SELECT SUM(valor_negocio) AS v FROM curated.fato_negocios
      WHERE status = 'fechado' AND finalidade = 'venda'
        AND EXTRACT(YEAR FROM data_fechamento) = 2025
    tolerancia: 0.02

  - id: 3
    pergunta: "Qual origem de lead tem a maior taxa de conversão em negócios fechados?"
    tipo: texto
    sql: >
      SELECT o.nome_origem AS v FROM curated.dim_origem o
      ORDER BY (
        SELECT COUNT(*) FROM curated.fato_negocios n
        JOIN curated.fato_leads l ON l.lead_id = n.lead_id
        WHERE l.origem_id = o.origem_id AND n.status = 'fechado')::NUMERIC
        / NULLIF((SELECT COUNT(*) FROM curated.fato_leads l2
                  WHERE l2.origem_id = o.origem_id), 0) DESC NULLS LAST
      LIMIT 1

  - id: 4
    pergunta: "Qual corretor fechou mais negócios nos últimos 12 meses?"
    tipo: texto
    sql: >
      SELECT c.nome_corretor AS v FROM curated.fato_negocios n
      JOIN curated.dim_corretor c ON c.corretor_id = n.corretor_id
      WHERE n.status = 'fechado'
        AND n.data_fechamento >= date_trunc('month', CURRENT_DATE) - interval '11 months'
      GROUP BY c.nome_corretor ORDER BY COUNT(*) DESC LIMIT 1

  - id: 5
    pergunta: "Quantas visitas foram realizadas (com comparecimento) nos últimos 6 meses?"
    tipo: numero
    sql: >
      SELECT COUNT(*) AS v FROM curated.fato_visitas
      WHERE compareceu
        AND data >= date_trunc('month', CURRENT_DATE) - interval '5 months'
    tolerancia: 0

  - id: 6
    pergunta: "Qual o ticket médio das vendas fechadas em 2026?"
    tipo: numero
    sql: >
      SELECT AVG(valor_negocio) AS v FROM curated.fato_negocios
      WHERE status = 'fechado' AND finalidade = 'venda'
        AND EXTRACT(YEAR FROM data_fechamento) = 2026
    tolerancia: 0.02

  - id: 7
    pergunta: "Qual o tempo médio de fechamento, em dias, das locações nos últimos 12 meses?"
    tipo: numero
    sql: >
      SELECT AVG(data_fechamento - data_abertura) AS v FROM curated.fato_negocios
      WHERE status = 'fechado' AND finalidade = 'locacao'
        AND data_fechamento >= date_trunc('month', CURRENT_DATE) - interval '11 months'
    tolerancia: 0.05

  - id: 8
    pergunta: "Qual foi a receita total de comissões em 2025?"
    tipo: numero
    sql: >
      SELECT SUM(valor_comissao) AS v FROM curated.fato_negocios
      WHERE status = 'fechado' AND EXTRACT(YEAR FROM data_fechamento) = 2025
    tolerancia: 0.02

  - id: 9
    pergunta: "Quantos negócios foram perdidos por preço ou financiamento negado nos últimos 12 meses?"
    tipo: numero
    sql: >
      SELECT COUNT(*) AS v FROM curated.fato_negocios
      WHERE status = 'perdido' AND motivo_perda = 'Preço / financiamento negado'
        AND data_fechamento >= date_trunc('month', CURRENT_DATE) - interval '11 months'
    tolerancia: 0

  - id: 10
    pergunta: "Qual bairro teve mais negócios fechados nos últimos 6 meses?"
    tipo: texto
    sql: >
      SELECT b.bairro AS v FROM curated.fato_negocios n
      JOIN curated.imoveis i ON i.imovel_id = n.imovel_id
      JOIN curated.dim_bairro b ON b.bairro_id = i.bairro_id
      WHERE n.status = 'fechado'
        AND n.data_fechamento >= date_trunc('month', CURRENT_DATE) - interval '5 months'
      GROUP BY b.bairro ORDER BY COUNT(*) DESC LIMIT 1

  - id: 11
    pergunta: "Qual equipe ficou abaixo da meta de negócios em todos os últimos 3 meses?"
    tipo: texto
    sql: >
      SELECT e.nome_equipe AS v FROM analytics.v_realizado_meta v
      JOIN curated.dim_equipe e ON e.equipe_id = v.equipe_id
      WHERE v.competencia IN (
          SELECT DISTINCT competencia FROM analytics.v_realizado_meta
          ORDER BY competencia DESC LIMIT 3)
      GROUP BY e.nome_equipe
      HAVING COUNT(*) FILTER (WHERE v.realizado_negocios < v.meta_negocios) = 3
      LIMIT 1

  - id: 12
    pergunta: "Qual a taxa de conversão geral (lead para negócio fechado) dos últimos 12 meses?"
    tipo: numero
    sql: >
      SELECT ROUND(
        (SELECT COUNT(*) FROM curated.fato_negocios
          WHERE status = 'fechado'
            AND data_fechamento >= date_trunc('month', CURRENT_DATE)
              - interval '11 months')::NUMERIC
        / (SELECT COUNT(*) FROM curated.fato_leads
            WHERE data >= date_trunc('month', CURRENT_DATE)
              - interval '11 months'), 4) AS v
    tolerancia: 0.005

  - id: 13
    pergunta: "Quantos imóveis estão disponíveis para venda hoje?"
    tipo: numero
    sql: >
      SELECT COUNT(*) AS v FROM curated.imoveis
      WHERE status = 'disponivel' AND finalidade = 'venda'
    tolerancia: 0

  - id: 14
    pergunta: "Em que mês de 2025 houve mais negócios fechados?"
    tipo: texto
    sql: >
      SELECT CASE m::INT
        WHEN 1 THEN 'janeiro' WHEN 2 THEN 'fevereiro' WHEN 3 THEN 'março'
        WHEN 4 THEN 'abril' WHEN 5 THEN 'maio' WHEN 6 THEN 'junho'
        WHEN 7 THEN 'julho' WHEN 8 THEN 'agosto' WHEN 9 THEN 'setembro'
        WHEN 10 THEN 'outubro' WHEN 11 THEN 'novembro' ELSE 'dezembro' END AS v
      FROM (
        SELECT EXTRACT(MONTH FROM data_fechamento) AS m
        FROM curated.fato_negocios
        WHERE status = 'fechado' AND EXTRACT(YEAR FROM data_fechamento) = 2025
        GROUP BY 1 ORDER BY COUNT(*) DESC LIMIT 1) t

  - id: 15
    pergunta: "Qual a taxa de conversão da origem Indicação nos últimos 12 meses?"
    tipo: numero
    sql: >
      SELECT ROUND(
        (SELECT COUNT(*) FROM curated.fato_negocios n
         JOIN curated.fato_leads l ON l.lead_id = n.lead_id
         JOIN curated.dim_origem o ON o.origem_id = l.origem_id
          WHERE n.status = 'fechado' AND o.nome_origem = 'Indicação'
            AND n.data_fechamento >= date_trunc('month', CURRENT_DATE)
              - interval '11 months')::NUMERIC
        / NULLIF((SELECT COUNT(*) FROM curated.fato_leads l
                  JOIN curated.dim_origem o ON o.origem_id = l.origem_id
                  WHERE o.nome_origem = 'Indicação'
                    AND l.data >= date_trunc('month', CURRENT_DATE)
                      - interval '11 months'), 0), 4) AS v
    tolerancia: 0.01

  - id: 16
    pergunta: "Qual a taxa de conversão do Facebook Ads nos últimos 12 meses?"
    tipo: numero
    sql: >
      SELECT ROUND(
        (SELECT COUNT(*) FROM curated.fato_negocios n
         JOIN curated.fato_leads l ON l.lead_id = n.lead_id
         JOIN curated.dim_origem o ON o.origem_id = l.origem_id
          WHERE n.status = 'fechado' AND o.nome_origem = 'Facebook Ads'
            AND n.data_fechamento >= date_trunc('month', CURRENT_DATE)
              - interval '11 months')::NUMERIC
        / NULLIF((SELECT COUNT(*) FROM curated.fato_leads l
                  JOIN curated.dim_origem o ON o.origem_id = l.origem_id
                  WHERE o.nome_origem = 'Facebook Ads'
                    AND l.data >= date_trunc('month', CURRENT_DATE)
                      - interval '11 months'), 0), 4) AS v
    tolerancia: 0.01

  - id: 17
    pergunta: "Quantas propostas foram enviadas no segundo trimestre de 2026?"
    tipo: numero
    sql: >
      SELECT COUNT(*) AS v FROM curated.fato_propostas
      WHERE data >= DATE '2026-04-01' AND data < DATE '2026-07-01'
    tolerancia: 0

  - id: 18
    pergunta: "Qual o VGV de vendas do bairro Jardim Horizonte no ano de 2026?"
    tipo: numero
    sql: >
      SELECT SUM(n.valor_negocio) AS v FROM curated.fato_negocios n
      JOIN curated.imoveis i ON i.imovel_id = n.imovel_id
      JOIN curated.dim_bairro b ON b.bairro_id = i.bairro_id
      WHERE n.status = 'fechado' AND n.finalidade = 'venda'
        AND b.bairro = 'Jardim Horizonte'
        AND EXTRACT(YEAR FROM n.data_fechamento) = 2026
    tolerancia: 0.02

  - id: 19
    pergunta: "Quem são os 3 corretores com mais negócios fechados nos últimos 12 meses?"
    tipo: lista
    sql: >
      SELECT c.nome_corretor AS v FROM curated.fato_negocios n
      JOIN curated.dim_corretor c ON c.corretor_id = n.corretor_id
      WHERE n.status = 'fechado'
        AND n.data_fechamento >= date_trunc('month', CURRENT_DATE) - interval '11 months'
      GROUP BY c.nome_corretor ORDER BY COUNT(*) DESC LIMIT 3

  - id: 20
    pergunta: "Qual tipo de imóvel teve mais negócios fechados nos últimos 12 meses?"
    tipo: texto
    sql: >
      SELECT i.tipo AS v FROM curated.fato_negocios n
      JOIN curated.imoveis i ON i.imovel_id = n.imovel_id
      WHERE n.status = 'fechado'
        AND n.data_fechamento >= date_trunc('month', CURRENT_DATE) - interval '11 months'
      GROUP BY i.tipo ORDER BY COUNT(*) DESC LIMIT 1

  - id: 21
    pergunta: "Gere um relatório em PDF das vendas de 2025, com resumo e uma tabela por mês."
    tipo: artefato
    formato: pdf

  - id: 22
    pergunta: "Exporte para uma planilha Excel os negócios fechados do último trimestre."
    tipo: artefato
    formato: xlsx

